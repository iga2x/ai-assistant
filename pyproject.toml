[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
authors = [
    { name = "AI Assistant Developer", email = "dev@example.com" },
]
description = "A clean, installable terminal AI assistant for PC tasks, coding, and security workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "schedule>=1.2.0",
]


[tool.setuptools]
packages = ["assistant"]


[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.scripts]
assistant = "assistant.main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
